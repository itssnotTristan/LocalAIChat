name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Check toolchain
        run: |
          xcodebuild -version
          flutter --version
      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze and test
        working-directory: app
        run: |
          dart analyze lib test tools --fatal-warnings
          flutter test --no-pub
      - name: Build for physical iPhone without cloud-held credentials
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package IPA for local signing with AltStore
        working-directory: app
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry LocalAIChat-unsigned.ipa Payload
          unzip -t LocalAIChat-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAIChat-unsigned-IPA
          path: app/LocalAIChat-unsigned.ipa
          retention-days: 7
      - name: Capture iPhone simulator preview
        working-directory: app
        run: |
          simulator=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name == "iPhone Air" or .name == "iPhone 17 Air")) | .udid][0] // empty')
          if [ -z "$simulator" ]; then
            simulator=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | .udid][0] // empty')
          fi
          test -n "$simulator"
          xcrun simctl list devices available | grep "$simulator"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          flutter build ios --simulator --no-pub
          xcrun simctl install "$simulator" build/ios/iphonesimulator/Runner.app
          container=$(xcrun simctl get_app_container "$simulator" com.localai.localAiChat data)
          mkdir -p "$container/Library/Application Support"
          touch "$container/Library/Application Support/run-keychain-self-test"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          for attempt in $(seq 1 20); do
            if [ -f "$container/Library/Application Support/keychain-test.json" ]; then break; fi
            sleep 1
          done
          cat "$container/Library/Application Support/keychain-test.json"
          grep -q '"ok":true' "$container/Library/Application Support/keychain-test.json"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          sleep 5
          xcrun simctl io "$simulator" screenshot iphone-preview.png
          xcrun simctl terminate "$simulator" com.localai.localAiChat
          mkdir -p "$container/Library/Application Support"
          printf '%s' '{"themeName":"Chat Dark","backgroundStyle":"Quiet","motion":false,"chats":[{"id":"preview","title":"UI preview","entries":[{"role":"user","text":"Example message","frames":[]},{"role":"assistant","text":"Example reply","frames":[]}]}],"chatId":"preview"}' > "$container/Library/Application Support/local_chat.json"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          sleep 5
          xcrun simctl io "$simulator" screenshot iphone-preview-dark.png
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAIChat-iPhone-preview
          path: app/iphone-preview*.png
          retention-days: 7
