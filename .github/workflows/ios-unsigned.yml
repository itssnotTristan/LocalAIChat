name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Check toolchain
        run: |
          xcodebuild -version
          flutter --version
      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get
      - name: Install pinned iOS Metal inference library
        working-directory: app
        run: |
          curl --fail --location --retry 3 \
            https://github.com/gsmlg-app/lib_llama_cpp/releases/download/v0.7.3/lib_llama_cpp-prebuilt-metal-0.7.3.tar.gz \
            -o "$RUNNER_TEMP/llama-metal.tar.gz"
          echo 'abb6feb421eebd881d314a4132ce0951427b66beed91a7581e466cae6e1436c2  '"$RUNNER_TEMP/llama-metal.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/llama-metal"
          tar -xzf "$RUNNER_TEMP/llama-metal.tar.gz" -C "$RUNNER_TEMP/llama-metal" ios/lib_llama_cpp_ios.xcframework
          package_path=$(python3 - <<'PY'
          import json
          import urllib.parse
          from pathlib import Path
          config = json.loads(Path('.dart_tool/package_config.json').read_text())
          uri = next(p['rootUri'] for p in config['packages'] if p['name'] == 'lib_llama_cpp_ios')
          print(urllib.parse.unquote(urllib.parse.urlparse(uri).path))
          PY
          )
          frameworks="$package_path/ios/lib_llama_cpp_ios/Frameworks"
          test -d "$frameworks/lib_llama_cpp_ios.xcframework"
          rm -rf "$frameworks/lib_llama_cpp_ios.xcframework"
          cp -R "$RUNNER_TEMP/llama-metal/ios/lib_llama_cpp_ios.xcframework" "$frameworks/"
          test -f "$frameworks/lib_llama_cpp_ios.xcframework/ios-arm64/lib_llama_cpp_ios.framework/lib_llama_cpp_ios"
      - name: Analyze and test
        working-directory: app
        run: |
          dart analyze lib test tools --fatal-warnings
          flutter test --no-pub
      - name: Build for physical iPhone without cloud-held credentials
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package IPA for local signing with AltStore
        working-directory: app
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist | grep -Fx FluxLira
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons:AppIconOrange' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons:AppIconElectric' build/ios/iphoneos/Runner.app/Info.plist
          zip -qry FluxLira-unsigned.ipa Payload
          unzip -t FluxLira-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FluxLira-unsigned-IPA
          path: app/FluxLira-unsigned.ipa
          retention-days: 7
      - name: Capture iPhone simulator preview
        working-directory: app
        run: |
          simulator=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name == "iPhone Air" or .name == "iPhone 17 Air")) | .udid][0] // empty')
          if [ -z "$simulator" ]; then
            simulator=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | .udid][0] // empty')
          fi
          test -n "$simulator"
          xcrun simctl list devices available | grep "$simulator"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          flutter build ios --simulator --no-pub
          xcrun simctl install "$simulator" build/ios/iphonesimulator/Runner.app
          container=$(xcrun simctl get_app_container "$simulator" com.localai.localAiChat data)
          mkdir -p "$container/Library/Application Support"
          touch "$container/Library/Application Support/run-keychain-self-test"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          for attempt in $(seq 1 20); do
            if [ -f "$container/Library/Application Support/keychain-test.json" ]; then break; fi
            sleep 1
          done
          cat "$container/Library/Application Support/keychain-test.json"
          grep -q '"ok":true' "$container/Library/Application Support/keychain-test.json"
          touch "$container/Library/Application Support/run-system-speech-self-test"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          for attempt in $(seq 1 35); do
            if [ -f "$container/Library/Application Support/system-speech-test.json" ]; then break; fi
            sleep 1
          done
          cat "$container/Library/Application Support/system-speech-test.json"
          grep -q '"ok":true' "$container/Library/Application Support/system-speech-test.json"
          touch "$container/Library/Application Support/run-background-transfer-self-test"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          for attempt in $(seq 1 55); do
            if [ -f "$container/Library/Application Support/background-transfer-test.json" ]; then break; fi
            sleep 1
          done
          cat "$container/Library/Application Support/background-transfer-test.json"
          grep -q '"ok":true' "$container/Library/Application Support/background-transfer-test.json"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          sleep 5
          xcrun simctl io "$simulator" screenshot iphone-preview.png
          xcrun simctl terminate "$simulator" com.localai.localAiChat
          mkdir -p "$container/Library/Application Support"
          printf '%s' '{"themeName":"Chat Dark","backgroundStyle":"Quiet","motion":false,"chats":[{"id":"preview","title":"UI preview","entries":[{"role":"user","text":"Example message","frames":[]},{"role":"assistant","text":"Example reply","frames":[]}]}],"chatId":"preview"}' > "$container/Library/Application Support/local_chat.json"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          sleep 5
          xcrun simctl io "$simulator" screenshot iphone-preview-dark.png
          xcrun simctl terminate "$simulator" com.localai.localAiChat
          printf '%s' '{"themeName":"Chat Dark","backgroundStyle":"Starfield","motion":true,"starColor":4294946166,"chats":[{"id":"preview","title":"Starfield","entries":[{"role":"user","text":"Example message","frames":[]},{"role":"assistant","text":"Example reply","frames":[]}]}],"chatId":"preview"}' > "$container/Library/Application Support/local_chat.json"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          sleep 5
          xcrun simctl io "$simulator" screenshot iphone-preview-stars.png
          xcrun simctl terminate "$simulator" com.localai.localAiChat
          printf '%s' '{"themeName":"Chat Dark","backgroundStyle":"Northern Lights","motion":true,"auroraColor":4284028602,"chats":[{"id":"preview","title":"Northern Lights","entries":[{"role":"user","text":"Example message","frames":[]},{"role":"assistant","text":"Example reply","frames":[]}]}],"chatId":"preview"}' > "$container/Library/Application Support/local_chat.json"
          xcrun simctl launch "$simulator" com.localai.localAiChat
          sleep 5
          xcrun simctl io "$simulator" screenshot iphone-preview-aurora.png
      - uses: actions/upload-artifact@v4
        with:
          name: FluxLira-iPhone-preview
          path: app/iphone-preview*.png
          retention-days: 7
